name: Build Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Clean Flutter Project
        run: flutter create temp_app

      - name: Copy Your Code
        run: |
          cp pubspec.yaml temp_app/pubspec.yaml
          cp lib/main.dart temp_app/lib/main.dart

      - name: Add Internet Permission
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' temp_app/android/app/src/main/AndroidManifest.xml

      - name: Get Dependencies & Build APK
        run: |
          cd temp_app
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Spider-Pro-APK
          path: temp_app/build/app/outputs/flutter-apk/app-release.apk
